      {type:"teach", h:"Two completely different ways to fight disease", p:"When you get sick, you go to a doctor. The doctor figures out what's wrong with **you** and tries to make **you** better. That's **clinical medicine** — it focuses on one patient at a time.\n\nBut imagine 200 kids in your town all get the same stomach bug in the same week. A doctor could treat each one, but someone needs to ask a bigger question: *why is this happening to so many people, and how do we stop it from spreading?* That bigger job is **public health** — protecting the health of a whole **population** (a large group of people) instead of just one person."},
      {type:"analogy", p:"Clinical medicine is like a **firefighter** rushing in to put out a fire that's already burning. Public health is like the **fire-safety inspector** who installs smoke alarms, writes building codes, and runs fire drills so fires don't start in the first place. Both are essential — but they work at totally different scales."},

      {type:"teach", h:"From curses to clues", p:"For most of human history, people thought disease came from angry gods, bad luck, or 'evil air.' Nobody studied patterns. Around **400 BC**, a Greek doctor named **Hippocrates** had a radical idea: maybe disease has *natural* causes you can observe and reason about — like climate, water, and how people live. That idea is the seed of all of epidemiology."},
      {type:"teach", h:"Learning to count", p:"Fast-forward to **1662**, when a Londoner named **John Graunt** did something nobody had done before: he collected the city's death records and counted them. By turning deaths into **data**, he could spot patterns — which diseases were rising, who was dying, and when. Counting and comparing is still the heart of what Disease Detectives do today."},

    lesson: [
      {type:"teach", h:"Breaking down a scary-looking word", p:"**Epidemiology** sounds intimidating, but it's built from simple Greek parts: *epi* (upon) + *demos* (the people) + *logy* (study of). Put together: **the study of what happens to people.** More precisely, it's the study of how health and disease are spread across a population, and what *causes* those patterns."},
      {type:"teach", h:"The two big questions: distribution and determinants", p:"Epidemiologists study two things. First, **distribution** — *where* and *among whom* a disease shows up. Is it hitting one neighborhood? One age group? One season? Second, **determinants** — the *factors that cause or influence* the disease. A determinant is anything that makes the health outcome more or less likely, like contaminated water, smoking, or a mosquito population. **Distribution tells you the pattern; determinants tell you the cause.**"},
      {type:"analogy", p:"Think of a detective at a crime scene. **Distribution** is asking *who* was affected and *where* — building the map of what happened. **Determinants** is figuring out *whodunit* — the actual cause behind the pattern. Epidemiologists do both."},

        {label:"WHEN did it start?", detail:"If everyone got sick at once, they were likely exposed at the same moment — like one meal."},
        {label:"WHY did it spread?", detail:"Now combine the clues into a theory: maybe the chicken sat out too long. That's the **determinant**."}

function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

let S = {
  view: 'profiles',
  profile: null,
  profiles: load('dd_profiles',[]),
  selWeek: null,
  selDay: null,
  done: [],
  scores: {},
  q: {active:false,idx:0,sel:null,chk:false,right:0,fin:false},
  fc: {idx:0,rev:false}
};

function activateProfile(name){
  S.profile = name;
  S.done = load('dd_done_'+name, []);
  S.scores = load('dd_scores_'+name, {});
  save('dd_lastProfile', name);
}

function setState(patch){ Object.assign(S,patch); render(); }
function setQ(patch){ Object.assign(S.q,patch); render(); }
function setFc(patch){ Object.assign(S.fc,patch); render(); }

function toggleDone(n){
  S.done = S.done.includes(n) ? S.done.filter(x=>x!==n) : [...S.done,n];
  save('dd_done_'+S.profile,S.done);
  setState({view:'week'});
}

function renderQuiz(){
  const wk=weekOf(S.selDay), q=S.selDay.quiz[S.q.idx];
  const bars=S.selDay.quiz.map((_,i)=>`<div class="qbar" style="background:${i<S.q.idx?wk.color:i===S.q.idx?'#5a6a8a':'#1a1f35'}"></div>`).join('');
  const opts=q.options.map((opt,i)=>{
    let bg='#1a1f35',brd='1px solid #2a3550',suffix='';
    if(S.q.chk){
      if(i===q.answer){bg='#143a1f';brd='2px solid #2ec36b';suffix='<span class="green" style="margin-left:auto;flex-shrink:0">✓</span>';}
      else if(i===S.q.sel){bg='#3a1414';brd='2px solid #d64545';suffix='<span style="color:#d64545;margin-left:auto;flex-shrink:0">✗</span>';}
    } else if(i===S.q.sel){bg='#1f2740';brd=`2px solid ${wk.color}`;}
    return `<button class="opt-btn" style="background:${bg};border:${brd}" onclick="${S.q.chk?'':'selectOpt('+i+')'}" ${S.q.chk?'disabled':''}>
      <span class="opt-letter">${letters[i]}</span><span style="flex:1">${esc(opt)}</span>${suffix}
    </button>`;
  }).join('');
  const explain = S.q.chk ? `<div class="explain" style="border-left:3px solid ${wk.color}">
    <strong style="color:${S.q.sel===q.answer?'#2ec36b':'#e8a33d'}">${S.q.sel===q.answer?'Correct! ':'Not quite. '}</strong>${esc(q.explain)}
  </div>` : '';
  const actionBtn = !S.q.chk
    ? `<button class="btn" style="background:${S.q.sel===null?'#2a3550':''+wk.color}" onclick="checkAns()" ${S.q.sel===null?'disabled':''}>Check Answer</button>`
    : `<button class="btn" style="background:${wk.color}" onclick="nextQ()">${S.q.idx+1<S.selDay.quiz.length?'Next Question →':'See Results →'}</button>`;
  return `<div style="background:${wk.color};padding:16px 20px;display:flex;justify-content:space-between;align-items:center">
    <strong style="font-size:17px">Quiz · Day ${S.selDay.day}</strong>
    <span style="font-family:monospace;font-size:13px">Q${S.q.idx+1}/${S.selDay.quiz.length}</span>
  </div>

    <div class="qbar-wrap">${bars}</div>
    <p style="font-size:19px;line-height:1.5;margin-bottom:22px;font-weight:bold">${esc(q.q)}</p>
    ${opts}${explain}${actionBtn}
  </div>`;
}

// Lightweight markup: escape HTML, then **bold**, and \n\n => paragraphs
function fmt(t){
  let s = esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  return s.split('\n\n').map(p=>p.trim()).filter(Boolean).join('</p><p class="lesson-p">');
}

  if(kind==='timeline') return `<div class="dgm">
    ${[['~400 BC','Hippocrates says disease has natural causes, not curses from the gods.'],
       ['1662','John Graunt counts deaths in London — the first disease data analysis.'],

  if(kind==='detectiveW') return `<div class="dgm"><div class="det-grid">
    ${[['WHO','#7fc8ff','Who got sick? (age, sex, job)'],
       ['WHAT','#7fe0a0','What is the disease?'],
       ['WHERE','#e0c07f','Where did it happen?'],
       ['WHEN','#e07f9f','When did it start?'],
       ['WHY','#c08fe0','Why did it spread?']]
      .map(([w,c,d])=>`<div class="det-cell" style="flex:1 1 30%"><div class="det-pct" style="color:${c};font-size:15px">${w}</div><div class="det-lbl" style="font-size:12px">${esc(d)}</div></div>`).join('')}
  </div><div class="dgm-cap">An epidemiologist is a detective — these are the questions they always ask.</div></div>`;

  if(kind==='determinants') return `<div class="dgm"><div class="det-grid">
    ${[['~40%','#7fe0a0','Social & economic factors (where you live, income, education)'],
       ['~30%','#e0c07f','Health behaviors (eating, exercise, smoking)'],
       ['~20%','#7fc8ff','Clinical care (doctors, medicine)'],
       ['~10%','#e07f9f','Physical environment (air, water, safety)']]
      .map(([p,c,d])=>`<div class="det-cell"><div class="det-pct" style="color:${c}">${p}</div><div class="det-lbl">${esc(d)}</div></div>`).join('')}
  </div><div class="dgm-cap">Genes matter too — but how long & well we live is mostly shaped by these factors.</div></div>`;

  if(kind==='pyramid') return `<div class="dgm">
    ${[['Counseling & education','#5a3a3a','78%'],

       ['Changing the environment','#2a5a5a','97%'],
       ['Socioeconomic factors','#2a4a6a','100%']]

function renderLesson(day, color){
  return day.lesson.map(sec=>{
    if(sec.type==='teach') return `<div class="card">${sec.h?`<div class="lesson-h">${esc(sec.h)}</div>`:''}<p class="lesson-p">${fmt(sec.p)}</p></div>`;
    if(sec.type==='analogy') return `<div class="callout callout-analogy"><div class="callout-title" style="color:#7fe0a0">🔑 Think of it like this</div><p class="lesson-p" style="color:inherit;margin:0">${fmt(sec.p)}</p></div>`;
    if(sec.type==='takeaway') return `<div class="callout callout-takeaway"><div class="callout-title" style="color:#b8a0ff">⭐ Key takeaway</div><p class="lesson-p" style="color:inherit;margin:0">${fmt(sec.p)}</p></div>`;
    if(sec.type==='diagram') return diagram(sec.kind, color);
    if(sec.type==='example'){
      const steps = sec.steps.map((st,i)=>{
        if(typeof st==='string') return `<div class="example-step"><span class="step-num">${i+1}</span><span>${fmt(st)}</span></div>`;
        return `<div class="example-step"><span class="step-num">${i+1}</span><span><span class="step-label">${esc(st.label)}</span> ${fmt(st.detail)}${st.calc?`<br><span class="calc">${esc(st.calc)}</span>`:''}</span></div>`;
      }).join('');
      return `<div class="example-box"><div class="callout-title" style="color:#9fe0c0;margin-bottom:12px">📝 ${esc(sec.h||'Worked Example')}</div>${steps}</div>`;
    }
    return '';
  }).join('');
}

    <p class="sub" style="font-size:14px">Summer Science Olympiad Course · Division B</p>
  </div>
  <div class="wrap" style="padding-top:24px">
    <h2 style="text-align:center;margin-bottom:10px">Choose a Learner</h2>
    ${intro}
    ${cards}
    <button class="btn" style="background:#1a4a2a;margin-top:8px" onclick="addProfile()">+ Add a Learner</button>
  </div>`;
}



// ── MAIN RENDER ────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(S.view==='profiles') app.innerHTML=renderProfiles();
  else if(S.view==='home') app.innerHTML=renderHome();
  else if(S.view==='week') app.innerHTML=renderWeek();
  else if(S.view==='day') app.innerHTML=renderDay();
  else if(S.view==='vocab') app.innerHTML=renderVocab();
  window.scrollTo(0,0);
}

// ── ACTIONS ────────────────────────────────────────────────────────
function pickProfileIdx(i){ activateProfile(S.profiles[i]); setState({view:'home'}); }
function switchUser(){ setState({view:'profiles'}); }
function addProfile(){
  const name = prompt("Enter the learner's name:");
  if(name && name.trim()){
    const clean = name.trim().slice(0,20);
    if(!S.profiles.includes(clean)){ S.profiles=[...S.profiles,clean]; save('dd_profiles',S.profiles); }
    activateProfile(clean);
    setState({view:'home'});
  }
}
function deleteProfileIdx(i){
  const name = S.profiles[i];
  if(confirm('Remove "'+name+'" and erase their progress? This cannot be undone.')){
    S.profiles = S.profiles.filter((_,j)=>j!==i);
    save('dd_profiles',S.profiles);
    try{localStorage.removeItem('dd_done_'+name);localStorage.removeItem('dd_scores_'+name);}catch{}
    render();
  }
}
function goHome(){ setState({view:'home'}); }
function goWeek(wi){ setState({view:'week',selWeek:wi}); }
function goVocab(){ setFc({idx:0,rev:false}); setState({view:'vocab'}); }
function goDay(dayNum){
  const day=allDays.find(d=>d.day===dayNum);
  S.selDay=day; S.q={active:false,idx:0,sel:null,chk:false,right:0,fin:false};
  setState({view:'day'});
}
function markDone(n){ toggleDone(n); }
function startQuiz(){ S.q={active:true,idx:0,sel:null,chk:false,right:0,fin:false}; render(); }
function selectOpt(i){ if(!S.q.chk){ S.q.sel=i; render(); } }
function checkAns(){
  if(S.q.sel===null) return;
  if(S.q.sel===S.selDay.quiz[S.q.idx].answer) S.q.right++;
  S.q.chk=true; render();
}
function nextQ(){
  if(S.q.idx+1<S.selDay.quiz.length){ S.q.idx++; S.q.sel=null; S.q.chk=false; render(); }
  else {
    const best=Math.max(S.q.right, S.scores[S.selDay.day]||0);
    S.scores={...S.scores,[S.selDay.day]:best};
    save('dd_scores_'+S.profile,S.scores);
    S.q.active=false; S.q.fin=true; render();
  }
}
function revealFc(){ setFc({rev:true}); }
function nextFc(){ setFc({idx:(S.fc.idx+1)%allVocab.length,rev:false}); }
function shuffleFc(){ setFc({idx:Math.floor(Math.random()*allVocab.length),rev:false}); }

// ── BOOT ───────────────────────────────────────────────────────────
(function boot(){
  const last = load('dd_lastProfile', null);
  if(S.profiles.length && last && S.profiles.includes(last)){
    activateProfile(last);
    S.view = 'home';
  } else {
    S.view = 'profiles';
  }
  render();
})();
</script>
</body>
</html>
